# Builds ZFPlus for Windows (installer and portable), signs the
# checksums the updater checks, and publishes a GitHub release. Runs when
# plus/REVISION or plus/UPSTREAM change on main, by hand, or after the
# daily sync merged a new ZapFast release.
name: plus-release
on:
  push:
    branches: [main]
    paths: [plus/REVISION, plus/UPSTREAM]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
concurrency:
  group: plus-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Incremental builds only help a build run again in the same place.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # The packages the build needs (335 MB, mostly mingw-w64), kept between
      # runs: fetched fresh, a slow Ubuntu mirror once took 58 minutes.
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: plus-apt-v1-${{ hashFiles('plus/ci-tools.sh') }}
      - name: Tools
        run: plus/ci-tools.sh
      # Compiled dependencies, kept for the tests and for the Windows build
      # apart, each saved as soon as it is made (the tests' were deleted for
      # room before they could be saved, so every run compiled them anew).
      - name: Restore the test build
        id: test-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: plus-test-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: plus-test-
      - name: Restore the Windows build
        id: windows-cache
        uses: actions/cache/restore@v4
        with:
          path: target/x86_64-pc-windows-gnu
          key: plus-windows-gnu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: plus-windows-gnu-
      # The release gate: every test, including the one that finds each
      # feature in feature_check::INVENTORY on screen, so a release that lost
      # a switch, a button or a menu entry is never published.
      - name: Test
        run: |
          cargo test --locked --lib --features demo -- --test-threads 4
          # Only what the next run can use: the dependencies, not ZFPlus itself.
          rm -rf target/debug/incremental target/debug/deps/zapfast-* target/debug/.fingerprint/zapfast-*
      - name: Keep the test build
        uses: actions/cache/save@v4
        if: steps.test-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: plus-test-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Make room for the Windows build
        run: rm -rf target/debug
      - name: Build and package
        id: build
        env:
          SIGNING_KEY: ${{ secrets.ZAPFAST_PLUS_SIGNING_KEY }}
        run: |
          key=$(mktemp)
          printf '%s\n' "$SIGNING_KEY" > "$key"
          plus/build-windows.sh dist "$key"
          rm -f "$key"
      - name: Keep the Windows build
        uses: actions/cache/save@v4
        if: steps.windows-cache.outputs.cache-hit != 'true'
        with:
          path: target/x86_64-pc-windows-gnu
          key: plus-windows-gnu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.build.outputs.version }}
          upstream=$(cat plus/UPSTREAM)
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" dist/* --clobber
          else
            gh release create "v$version" dist/* --target main \
              --title "ZFPlus $version" \
              --notes "ZFPlus $version, built on ZapFast $upstream (https://github.com/crmne/zapfast/releases/tag/$upstream) with the Enhancements. Install: zapfast-v$version-x86_64-pc-windows-msvc.msi (no admin rights). Portable: the .zip."
          fi
