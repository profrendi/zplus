# Builds ZFPlus for Windows (installer and portable), signs the
# checksums the updater checks, and publishes a GitHub release. Runs when
# plus/REVISION or plus/UPSTREAM change on main, by hand, or after the
# daily sync merged a new ZapFast release.
name: plus-release
on:
  push:
    branches: [main]
    paths: [plus/REVISION, plus/UPSTREAM]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
concurrency:
  group: plus-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mingw-w64 wixl msitools zip nasm cmake perl \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libpipewire-0.3-dev clang libclang-dev
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: plus-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: plus-windows-
      # The release gate: every test, including the one that finds each
      # feature in feature_check::INVENTORY on screen, so a release that lost
      # a switch, a button or a menu entry is never published.
      - name: Test
        run: |
          cargo test --locked --lib --features demo -- --test-threads 4
          # The Windows build needs the room.
          rm -rf target/debug
      - name: Build and package
        id: build
        env:
          SIGNING_KEY: ${{ secrets.ZAPFAST_PLUS_SIGNING_KEY }}
        run: |
          key=$(mktemp)
          printf '%s\n' "$SIGNING_KEY" > "$key"
          plus/build-windows.sh dist "$key"
          rm -f "$key"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.build.outputs.version }}
          upstream=$(cat plus/UPSTREAM)
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" dist/* --clobber
          else
            gh release create "v$version" dist/* --target main \
              --title "ZFPlus $version" \
              --notes "ZFPlus $version, built on ZapFast $upstream (https://github.com/crmne/zapfast/releases/tag/$upstream) with the Enhancements. Install: zapfast-v$version-x86_64-pc-windows-msvc.msi (no admin rights). Portable: the .zip."
          fi
