# Builds ZFPlus Prof, the measurement build (the `prof` feature), as a
# portable Windows zip, published as a pre-release tagged prof-<version>.
# Installed ZFPlus never updates to it: the updater reads only the latest
# full release, which a pre-release never is.
name: plus-prof
on:
  push:
    branches: [zfplus-prof]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plus-prof
  cancel-in-progress: true
jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mingw-w64 zip nasm cmake
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: plus-prof-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            plus-prof-
            plus-windows-
      - name: Build
        run: |
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER="$PWD/plus/mingw-link.sh"
          export CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc-posix
          export CXX_x86_64_pc_windows_gnu=x86_64-w64-mingw32-g++-posix
          export AR_x86_64_pc_windows_gnu=x86_64-w64-mingw32-ar
          export RANLIB_x86_64_pc_windows_gnu=x86_64-w64-mingw32-ranlib
          export RC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-windres
          # No update channel: this build never updates itself.
          unset ZAPFAST_PLUS_REPO
          cargo build --locked --release --target x86_64-pc-windows-gnu --features prof
      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          dir="zfplus-prof-$version"
          mkdir -p "dist/$dir"
          cp target/x86_64-pc-windows-gnu/release/zapfast.exe "dist/$dir/zfplus-prof.exe"
          cp plus/README-prof.txt "dist/$dir/BACA-DULU.txt"
          cp LICENSE "dist/$dir/"
          (cd dist && zip -qr9 "$dir.zip" "$dir")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: zfplus-prof
          path: dist/*.zip
          retention-days: 30
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="prof-${{ steps.package.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            gh release create "$tag" dist/*.zip --target zfplus-prof --prerelease --latest=false \
              --title "ZFPlus Prof ${{ steps.package.outputs.version }} (build pengukuran)" \
              --notes "Build pengukuran CPU, bukan rilis biasa. Portable, datanya terpisah di folder zfplus-prof-data, tidak memperbarui dirinya sendiri. Baca BACA-DULU.txt di dalam zip."
          fi
